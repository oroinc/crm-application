packages: []

engineStrict: true
ignoreScripts: true
loglevel: error
verifyDepsBeforeRun: false
initPackageManager: false

publicHoistPattern:
  - 'stylelint**'
  - 'webpack**'
  - '**loader**'
  - 'glob'
  - 'minimist'

allowedDeprecatedVersions:
  eslint: '^8.57'
  popper.js: '^1.16'

minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - "@oroinc/*"
